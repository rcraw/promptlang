## Field Descriptions

### REQUIRED FIELDS (Always Added)

**task_id** (string, REQUIRED)
- Unique identifier from post-task hook
- Format: "task-12345" or similar
- Used to track which task generated this file
- Example: "task-webinar-001"

**completion_date** (string, REQUIRED)
- Date when task completed
- Format: YYYY-MM-DD
- Used for archive directory naming
- Example: "2025-10-22"

**created** (string, REQUIRED)
- Timestamp when file was created
- Format: ISO 8601 (YYYY-MM-DDTHH:MM:SSZ)
- Used for provenance tracking
- Example: "2025-10-22T19:15:00Z"

**type** (enum, REQUIRED)
- File classification category
- Options: research | compiled | skill | code | documentation | config
- Used to determine archival behavior
- Example: "research"

**status** (enum, REQUIRED)
- Lifecycle status of file
- Options: draft | active | completed | archived
- Changes from "completed" to "archived" when moved to archives
- Example: "completed"

**project** (string, REQUIRED)
- Project identifier linking related files
- Auto-inferred from directory name or content
- Used for archive organization
- Example: "webinar-funnel-strategy"

### RECOMMENDED FIELDS (Often Auto-Inferred)

**modified** (string, optional)
- Last modification timestamp
- Format: ISO 8601
- Updated when file changes
- Example: "2025-10-22T20:30:00Z"

**phase** (enum, optional)
- Development phase when file created
- Options: discovery | strategy | implementation | testing | deployment
- Helps organize workflow stages
- Example: "discovery"

**sequence** (number, optional)
- Numeric order within project
- Used for sorting and file naming (01-, 02-, 03-)
- Auto-assigned based on timestamps
- Example: 1

### PROVENANCE FIELDS

**parent** (string or null, optional)
- Path to parent file this was derived from
- Use null if this is original work
- Example: "sandbox/research/original-analysis.md" or null

**children** (array, optional)
- Paths to files derived from this one
- Empty array [] if no children yet
- Example: ["sandbox/skills/webinar-funnel-builder/README.md"]

**derived_from** (array, optional)
- List of source files used to create this (for compiled outputs)
- Empty array [] if original research
- Example: ["source1.md", "source2.md", "source3.md"]

### AGENT CONTEXT FIELDS

**agent_type** (enum, optional)
- Type of AI agent that created/modified file
- Options: researcher | coder | reviewer | tester | coordinator | analyst
- Auto-inferred from file content analysis
- Example: "researcher"

**agent_task** (string, optional)
- Description of what the agent was asked to do
- Brief summary of task instructions
- Example: "Analyze r/aiagents subreddit for pain points"

**estimated_tokens** (number, optional)
- Approximate token count for this file
- Estimated from file size (1 token ≈ 4 characters)
- Used for cost tracking
- Example: 41000

### DESCRIPTIVE FIELDS

**tags** (array, optional)
- Searchable keywords
- Used for finding related files
- Example: [research, market-analysis, reddit, ai-agents]

**author** (string, optional)
- Human or agent identifier
- Format: "Name" or "Task Agent (type)"
- Example: "Task Agent (researcher)"

**summary** (string, optional)
- One-line description of file contents
- Auto-generated from first paragraph or heading
- Example: "Analysis of r/aiagents community sentiment and pain points"

