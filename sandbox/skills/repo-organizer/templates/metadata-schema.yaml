# Your Content Here

This template shows all available metadata fields. Remove fields that don't apply.

## Field Descriptions

**type:** Category of file (research=raw findings, compiled=synthesized output, skill=SPARC mode, etc.)

**status:** Lifecycle stage (draft=in progress, active=current work, completed=done but active, archived=moved to archives)

**project:** Identifier linking related files (e.g., "webinar-funnel-strategy")

**phase:** Development phase (discovery=research, strategy=planning, implementation=building, testing=QA, deployment=production)

**created/modified:** ISO 8601 timestamps

**sequence:** Numeric order in a series (1, 2, 3...)

**parent:** Path to file this was derived from (or null if original)

**children:** Paths to files derived from this one

**derived_from:** List of source files used to create this (for compiled outputs)

**agent_type:** Type of AI agent that created/modified file

**agent_task:** What the agent was asked to do

**estimated_tokens:** Approximate token count (useful for cost tracking)

**tags:** Searchable keywords

**author:** Human or agent identifier

**summary:** Brief description for quick scanning
